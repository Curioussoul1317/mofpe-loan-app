openapi: 3.0.3

info:
  title: Loan Portfolio Management API
  version: 1.0.0
  description: API for managing customers, loans and repayments.

servers:
  - url: /api

tags:
  - name: Authentication
  - name: Customers
  - name: Loans
  - name: Repayments
  - name: Dashboard
  - name: Currencies
  - name: Users

paths:

  /login:
    post:
      tags: [Authentication]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: admin@example.test
                password:
                  type: string
                  example: Password123!
      responses:
        '200':
          description: Login successful
        '422':
          description: Invalid credentials

  /logout:
    post:
      tags: [Authentication]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthenticated

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      description: Administrator and Loan Officer.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Search by name, email or phone
      responses:
        '200':
          description: Customer list
        '401':
          description: Unauthenticated

    post:
      tags: [Customers]
      summary: Create customer
      description: Administrator only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
      responses:
        '200':
          description: Customer created
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Validation error

  /customers/{customer}:
    get:
      tags: [Customers]
      summary: View customer
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer details
        '401':
          description: Unauthenticated
        '404':
          description: Customer not found

  /loans:
    get:
      tags: [Loans]
      summary: List loans
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Loan list
        '401':
          description: Unauthenticated

    post:
      tags: [Loans]
      summary: Create loan
      description: Administrator and Loan Officer.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanRequest'
      responses:
        '200':
          description: Loan created
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Validation error

  /loans/{loan}:
    get:
      tags: [Loans]
      summary: View loan
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      responses:
        '200':
          description: Loan details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoanResponse'
        '401':
          description: Unauthenticated
        '404':
          description: Loan not found

    patch:
      tags: [Loans]
      summary: Update loan status
      description: Administrator only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, closed]
                  example: closed
      responses:
        '200':
          description: Loan updated
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Loan not found
        '422':
          description: Validation error

  /loans/{loan}/repayments:
    get:
      tags: [Repayments]
      summary: List repayments
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      responses:
        '200':
          description: Repayment list
        '401':
          description: Unauthenticated
        '404':
          description: Loan not found

    post:
      tags: [Repayments]
      summary: Record repayment
      description: >
        Administrator and Loan Officer.
        The repayment currency must match the loan currency.
        The amount cannot exceed the outstanding balance.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepaymentRequest'
      responses:
        '200':
          description: Repayment recorded
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Loan not found
        '422':
          description: Invalid repayment

  /loans/{loan}/audit:
    get:
      tags: [Loans]
      summary: View loan audit history
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LoanId'
      responses:
        '200':
          description: Complete loan history
        '401':
          description: Unauthenticated
        '404':
          description: Loan not found

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Portfolio totals by currency
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portfolio dashboard
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    - currency: USD
                      active_loans: 50
                      total_principal: "50000000.00"
                      total_outstanding: "25000000.00"
                    - currency: MVR
                      active_loans: 50
                      total_principal: "50000000.00"
                      total_outstanding: "25000000.00"
        '401':
          description: Unauthenticated

  /currencies:
    get:
      tags: [Currencies]
      summary: List currencies
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Currency list

    post:
      tags: [Currencies]
      summary: Add currency
      description: Administrator only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrencyRequest'
      responses:
        '201':
          description: Currency created
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Validation error

  /users:
    get:
      tags: [Users]
      summary: List users
      description: Administrator only.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User list
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden

    post:
      tags: [Users]
      summary: Create user
      description: Administrator only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: User created
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '422':
          description: Validation error

  /users/{user}:
    patch:
      tags: [Users]
      summary: Update user
      description: Administrator only.
      security:
        - bearerAuth: []
      parameters:
        - name: user
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                role:
                  type: string
                  enum: [administrator, loan_officer]
      responses:
        '200':
          description: User updated
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: User not found
        '422':
          description: Validation error


components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:

    LoanId:
      name: loan
      in: path
      required: true
      schema:
        type: integer
      example: 1

    CustomerId:
      name: customer
      in: path
      required: true
      schema:
        type: integer
      example: 1

  schemas:

    CustomerRequest:
      type: object
      required:
        - name
        - email
        - phone
        - status
      properties:
        name:
          type: string
          example: Ahmed Asad
        email:
          type: string
          example: asad@example.com
        phone:
          type: string
          example: "7777777"
        status:
          type: string
          enum: [active, inactive]
 
  LoanRequest:
    type: object
    required:
      - customer_id
      - currency_id
      - principal_amount
      - start_date
      - maturity_date
      - status
    properties:
      customer_id:
        type: integer
      currency_id:
        type: integer
      principal_amount:
        type: string
        example: "1000000.00"
      start_date:
        type: string
        format: date
      maturity_date:
        type: string
        format: date
      status:
        type: string
        enum: [active, closed]

    RepaymentRequest:
      type: object
      required:
        - currency_id
        - amount
        - payment_date
      properties:
        currency_id:
          type: integer
        amount:
          type: string
          example: "250000.00"
        payment_date:
          type: string
          format: date

    CurrencyRequest:
      type: object
      required:
        - code
        - name
        - decimal_places
      properties:
        code:
          type: string
          example: KWD
        name:
          type: string
          example: Kuwaiti Dinar
        decimal_places:
          type: integer
          example: 3

    UserRequest:
      type: object
      required:
        - name
        - email
        - password
        - role
      properties:
        name:
          type: string
          example: Loan Officer
        email:
          type: string
          example: officer@example.test
        password:
          type: string
          example: Password123!
        role:
          type: string
          enum:
            - administrator
            - loan_officer

    LoanResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
              example: 1
            loan_number:
              type: string
              example: LN-000001
            currency:
              type: string
              example: USD
            principal_amount:
              type: string
              example: "1000000.00"
            total_paid:
              type: string
              example: "350000.00"
            outstanding_balance:
              type: string
              example: "650000.00"
            status:
              type: string
              example: active